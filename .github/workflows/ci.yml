name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        # There was no prettier config, so both format scripts ran at the 80
        # column default against a codebase hand-written at 100 — and they
        # globbed .sql, which prettier cannot parse at all, so every run errored.
        # Neither had ever passed.
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # packages/logic must stay green independently of any surface that
      # consumes it (§12). The token contrast suite and the content-blind
      # notification suite run here too.
      - name: Test
        run: pnpm test

      # NON-GATING until the backlog below is cleared — not because it cannot
      # run. It can now.
      #
      # The note this replaces was correct about everything except the way out.
      # typescript-eslint throws on any TS >= 7 (typescript-eslint#10940), and
      # there really is no config workaround: `typescript` is a PEER of it, and
      # node-linker=hoisted means one copy exists in the tree, so overrides and
      # packageExtensions both fail — verified again, including patching the
      # version guard out, which gets a crash inside typescript-estree instead
      # because TS 7 genuinely moved the API it reads. The guard is honest.
      #
      # What was never checked is whether this project needs TS 7 at all. It
      # does not: nothing sets experimental.useTypeScriptCli, the tsconfig is
      # plain ES2022, and typecheck, test and build are all green on 5.9.3. So
      # every package pins 5.9.3 and the linter runs. TS 7's headline is
      # compile speed, against a typecheck that finishes in about a second.
      #
      # Turning it back on surfaced 44 problems that accumulated while nothing
      # was looking — 25 errors, mostly react-hooks rules that ship in v7.
      # continue-on-error stays until those are dealt with, and then it goes.
      - name: Lint (non-gating — clearing an existing backlog)
        run: pnpm lint
        continue-on-error: true

      # Parses every migration against the real PostgreSQL grammar, then
      # cross-checks that each FK target, function call, policy target and grant
      # resolves — and that no table is reachable without RLS and a policy.
      - name: Validate migrations
        run: pnpm check:sql

      # Checks the APPLIED schema — security_invoker on the views, pinned
      # search_path on every SECURITY DEFINER function, PostGIS resolving at
      # call time. Skips silently unless SUPABASE_DB_URL is set, so this stays
      # green until we decide to give CI a database credential.
      - name: Verify applied schema
        run: pnpm check:db
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Behavioural, not structural: creates a throwaway member and admin, acts
      # as each, and asserts what actually happens — the only way to test a
      # SECURITY DEFINER function's own authorisation. Runs inside a transaction
      # that is rolled back. Skips silently without the credential.
      - name: Verify admin guarantees
        run: pnpm check:admin
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # The moderation queue: a report opened, decided, and written down — with
      # no condition data anywhere in it.
      - name: Verify moderation
        run: pnpm check:moderation
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # The fuse's promise is not that a number reaches zero — it is that a chat
      # closes WITH A NOTE when it does. Behavioural, rolled back, skips without
      # the credential.
      - name: Verify sweeps
        run: pnpm check:sweeps
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # The walls, exercised as real members: who can see whom, who can reach
      # whom, and that no predicate answers a question about a third party.
      - name: Verify walls
        run: pnpm check:walls
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # RLS is row-level; the grant decides columns. A table-wide grant let a
      # member set their own verification_status and read everyone's date of
      # birth, past every policy, all of which were correct. This runs those
      # exploits rather than reading the ACL.
      - name: Verify column grants
        run: pnpm check:columns
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # The connect budget is the only thing between a member and unlimited
      # unsolicited approaches. `source` arrives from the client and 'drop'
      # costs nothing, so it has to be tried rather than read.
      - name: Verify the connect economy
        run: pnpm check:connects
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # A permanent code, one attribution per invitee forever, and a conversion
      # that fires at verification rather than at signup.
      - name: Verify referrals
        run: pnpm check:referrals
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Blocking and reporting: what a member reaches for on the worst day this
      # product will give them.
      - name: Verify safety paths
        run: pnpm check:safety
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Blurred-until-connected: the clear path must never reach a viewer who
      # has not connected, by any route.
      - name: Verify photo privacy
        run: pnpm check:photos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # §3.3 — "no selling exemptions from mechanics. Never monetized. Ever."
      # A paying member and a free one against the real walls.
      - name: Verify premium buys nothing it should not
        run: pnpm check:premium
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # §7.3 — config is hot-read and audited, and there is no key that sells
      # an exemption because there is no key to sell.
      - name: Verify config and metrics
        run: pnpm check:config
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Build
        run: pnpm build
